<section class="faq-section">
  <div class="container">
    <div class="article-rule">
      <span class="num">§ 10</span>
      <span>preguntas frecuentes</span>
      <span class="line"></span>
      <span>respuestas directas</span>
    </div>

    <div class="section-head">
      <span class="eyebrow">faq</span>

      <h2 class="display">
        Lo que más nos <em>preguntan</em>.
      </h2>
    </div>

    <div class="faq-list">
      @for (faq of faqs; track faq.question) {
        <details class="faq-item">
          <summary>
            {{ faq.question }}
          </summary>

          <div class="body">
            <p>
              {{ faq.answer }}

              @if (faq.link) {
                <a
                  [routerLink]="faq.link.route"
                  [fragment]="faq.link.fragment"
                  class="faq-link"
                >
                  {{ faq.link.label }}
                </a>
              }
            </p>
          </div>
        </details>
      }
    </div>
  </div>
</section>
